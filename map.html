<h1>My Favorite Location</h1>

<p>
    This page displays a Google Map.
</p>

<button id="questions">Questions?</button>

<div id="map"></div>

<script>
function initMap() {

    const chicago = {
        lat: 41.8781,
        lng: -87.6298
    };

    const map = new google.maps.Map(
        document.getElementById("map"),
        {
            zoom: 12,
            center: chicago
        }
    );

    const marker = new google.maps.Marker({
        position: chicago,
        map: map,
        title: "Chicago"
    });

    const infoWindow = new google.maps.InfoWindow({
        content: "<h3>Chicago</h3><p>My favorite city.</p>"
    });

    marker.addListener("click", () => {
        infoWindow.open(map, marker);
    });
}
</script>

<script async
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBM1F-BpX660SBK3-Vw9O9f7AEvTAIH8rI&callback=initMap">
</script>
